name: saas-inventory-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas_inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-saas_inventory}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (Prompt 10) — security.md#file-upload-security's "stored in
  # object storage, never the API container's local filesystem", applied to uploaded Excel files
  # and generated error reports (apps/api/src/common/storage/object-storage.service.ts). Any
  # S3-compatible endpoint works via the same S3_ENDPOINT/S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY
  # vars (.env.example) — MinIO is the local/dev choice, not a hard architectural dependency.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates S3_BUCKET if it doesn't already exist, then exits — MinIO itself never
  # auto-creates buckets. Not a long-running service (no restart policy, no healthcheck); `api`/
  # `import-worker` only need this to have run at least once, not to stay up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
             mc mb --ignore-existing local/${S3_BUCKET:-saas-inventory}"

  api:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @saas-inventory/api dev"
    environment:
      NODE_ENV: development
      # app_tenant — subject to RLS, used for all normal request handling. Its password is set
      # by the one-time `pnpm --filter @saas-inventory/api db:bootstrap-dev-roles` step (see
      # database/migrations/README.md), never by a migration file — see CLAUDE.md §7.4.
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_PASSWORD:?set APP_TENANT_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      # Bootstrap/superuser connection — used only by `db:migrate`/`db:bootstrap-dev-roles` and the seeds,
      # never by the running API process (database.md#migration-strategy).
      MIGRATOR_BOOTSTRAP_DATABASE_URL: postgresql://${POSTGRES_USER:-saas_inventory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      # Required by the migration wrapper (ADR-0041): the database a run must be connected to. Every migrator
      # consumer reads MIGRATOR_BOOTSTRAP_DATABASE_URL; the old name MIGRATOR_DATABASE_URL is a deprecated,
      # bootstrap-only alias and must not be set together with it.
      MIGRATOR_EXPECTED_DATABASE: ${POSTGRES_DB:-saas_inventory}
      # app_platform — BYPASSRLS, used only for the narrow administrative operations documented in
      # apps/api/src/database/platform-client.ts (Prompt 04). Password set by the same
      # db:bootstrap-dev-roles step as app_tenant's, from APP_PLATFORM_PASSWORD.
      APP_PLATFORM_DATABASE_URL: postgresql://app_platform:${APP_PLATFORM_PASSWORD:?set APP_PLATFORM_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Auth (Prompt 04) — see .env.example for the full list and defaults.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-19456}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      AUTH_RATE_LIMIT_TTL_SECONDS: ${AUTH_RATE_LIMIT_TTL_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Object storage (Prompt 10) — see the `minio`/`minio-init` services above.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-saas-inventory}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      IMPORT_SYNC_ROW_THRESHOLD: ${IMPORT_SYNC_ROW_THRESHOLD:-500}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-26214400}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-100000}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The Import Worker deployable (ADR-0029) — a separate process/container from `api`, never the
  # same one. Shares the monorepo image/volume for simplicity in local dev; a production deploy
  # gives it its own image build the same way `infrastructure/docker/api.Dockerfile` does for `api`
  # (see that file's own header once added — not part of this phase's Docker image work, only the
  # process split itself).
  import-worker:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @saas-inventory/api worker:import:dev"
    environment:
      NODE_ENV: development
      # app_tenant — the worker uses this exact connection for the actual catalog/inventory writes
      # once a job is claimed, identical to the API's own (client.ts's getDb()).
      DATABASE_URL: postgresql://app_tenant:${APP_TENANT_PASSWORD:?set APP_TENANT_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      # app_import_worker — the worker's own claiming connection (migration 0019, ADR-0029). Its
      # password is set by the same `db:bootstrap-dev-roles` step as the other roles, from
      # APP_IMPORT_WORKER_PASSWORD.
      APP_IMPORT_WORKER_DATABASE_URL: postgresql://app_import_worker:${APP_IMPORT_WORKER_PASSWORD:?set APP_IMPORT_WORKER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-saas-inventory}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-2000}
      IMPORT_WORKER_STALE_CLAIM_MS: ${IMPORT_WORKER_STALE_CLAIM_MS:-600000}
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The Event Processor deployable (ADR-0010 / events.md) — a separate process/container from both
  # `api` and `import-worker`, never the same one (ADR-0029). Claims rows from `event_outbox` with
  # `FOR UPDATE SKIP LOCKED`, retries with backoff, dead-letters poison events. FASE 15 registers
  # the n8n delivery handler: with N8N_EVENTS_ENABLED=true it POSTs each claimed envelope to the
  # generic n8n webhook over authenticated HTTPS (never Telegram directly — ADR-0012). Left
  # disabled by default here so local dev works with no n8n instance.
  event-processor:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @saas-inventory/api worker:events:dev"
    environment:
      NODE_ENV: development
      # app_event_processor — the Event Processor's own cross-tenant claiming connection
      # (migrations 0000/0010). Password set by the same `db:bootstrap-dev-roles` step, from
      # APP_EVENT_PROCESSOR_PASSWORD.
      APP_EVENT_PROCESSOR_DATABASE_URL: postgresql://app_event_processor:${APP_EVENT_PROCESSOR_PASSWORD:?set APP_EVENT_PROCESSOR_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-saas_inventory}
      EVENT_PROCESSOR_POLL_INTERVAL_MS: ${EVENT_PROCESSOR_POLL_INTERVAL_MS:-2000}
      EVENT_PROCESSOR_CLAIM_BATCH_SIZE: ${EVENT_PROCESSOR_CLAIM_BATCH_SIZE:-50}
      EVENT_PROCESSOR_STALE_CLAIM_MS: ${EVENT_PROCESSOR_STALE_CLAIM_MS:-300000}
      EVENT_PROCESSOR_MAX_ATTEMPTS: ${EVENT_PROCESSOR_MAX_ATTEMPTS:-10}
      EVENT_PROCESSOR_RETRY_BASE_MS: ${EVENT_PROCESSOR_RETRY_BASE_MS:-1000}
      EVENT_PROCESSOR_RETRY_MAX_MS: ${EVENT_PROCESSOR_RETRY_MAX_MS:-3600000}
      EVENT_PROCESSOR_RETRY_FACTOR: ${EVENT_PROCESSOR_RETRY_FACTOR:-2}
      # FASE 15 — n8n event delivery. Disabled by default; set N8N_EVENTS_ENABLED=true plus the
      # URL/secret in .env to forward events to a real n8n instance. Never a Telegram token here.
      N8N_EVENTS_ENABLED: ${N8N_EVENTS_ENABLED:-false}
      N8N_EVENTS_WEBHOOK_URL: ${N8N_EVENTS_WEBHOOK_URL:-}
      N8N_EVENTS_AUTH_TOKEN: ${N8N_EVENTS_AUTH_TOKEN:-}
      N8N_EVENTS_TIMEOUT_MS: ${N8N_EVENTS_TIMEOUT_MS:-10000}
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "corepack enable && pnpm install && pnpm --filter @saas-inventory/web dev"
    environment:
      NODE_ENV: development
      # The browser reaches the API through apps/web's own origin — `next.config.ts` rewrites
      # `/api/*` here — so session cookies stay first-party (frontend.md#transport--same-origin).
      # Server Components use this value directly (Docker-internal `api` hostname). `dev` runs
      # inside the container, so this resolves fine; the rewrite target is evaluated server-side.
      API_URL: http://api:4000
      # NEXT_PUBLIC_API_URL is deliberately unset — see .env.example. Set it only for a
      # cross-origin deployment with matching CORS + cookie flags.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/repo
      - web_node_modules:/repo/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_node_modules:
  web_node_modules:
